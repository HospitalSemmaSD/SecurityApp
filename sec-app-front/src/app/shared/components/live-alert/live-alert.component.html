@if (currentNotice(); as notice) {
    <div class="urgent-banner bg-danger text-white shadow-lg p-4 border-bottom border-white border-3">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="me-4 d-none d-md-block">
                        <i class="bi bi-exclamation-triangle-fill display-4 animate-pulse"></i>
                    </div>
                    <div>
                        <h4 class="fw-black mb-1 text-uppercase tracking-wider">COMUNICADO URGENTE: {{ notice.title }}</h4>
                        <p class="mb-0 fs-5 opacity-90">{{ notice.content }}</p>
                    </div>
                </div>
                <button class="btn btn-outline-light btn-lg rounded-pill px-4 fw-bold" (click)="close()">
                    <i class="bi bi-check2-circle me-1"></i> ENTENDIDO
                </button>
            </div>
        </div>
    </div>
}

<style>
    .animate-pulse {
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
