<h4>{{ title }}</h4>

<div *ngIf="image; else showActual">
  <img [src]="image" width="169" height="250" />
</div>
<ng-template #showActual>
  <img
    *ngIf="actualPhoto"
    [src]="'http://localhost:5038' + actualPhoto"
    width="169"
    height="250"
  />
</ng-template>

<div>
  <button type="button" mat-raised-button (click)="loadFile.click()">
    Buscar Imagen
  </button>
  <input
    type="file"
    hidden
    #loadFile
    accept="image/*"
    (change)="inputChange($event)"
  />
</div>
