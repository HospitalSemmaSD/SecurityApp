<h2>Listado de Usuarios</h2>

<app-generic-list [items]="users">
    <ng-container content>
        <table mat-table [dataSource]="users" class="mat-elevation-z8">
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef> Email </th>
                <td mat-cell *matCellDef="let element"> {{element.email}} </td>
            </ng-container>

            <ng-container matColumnDef="isAdmin">
                <th mat-header-cell *matHeaderCellDef> Es Admin </th>
                <td mat-cell *matCellDef="let element">
                    <mat-icon *ngIf="element.isAdmin">check</mat-icon>
                    <mat-icon *ngIf="!element.isAdmin">close</mat-icon>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Hacer Admin </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-button color="primary" (click)="makeAdmin(element.email)" *ngIf="!element.isAdmin">Hacer Admin</button>
                    <button mat-button color="warn" (click)="removeAdmin(element.email)" *ngIf="element.isAdmin">Remover Admin</button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
            <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>

        </table>
         <mat-paginator showFirstLastButtons [length]="totalRecords" [pageSize]="pagination.recordsPerPage"
      [pageSizeOptions]="[5, 10, 50]" class="mat-elevation-z8" (page)="onPaginateChange($event)"></mat-paginator>
    </ng-container>
</app-generic-list>
