<form>
  <mat-form-field class="w-100">
    <input
      type="text"
      placeholder="Buscar agente"
      matInput
      [formControl]="agentControl"
      [matAutocomplete]="auto"
    />
    <mat-autocomplete
      #auto="matAutocomplete"
      (optionSelected)="agentSelected($event)"
    >
      @for (item of agents; track $index) {
      <mat-option [value]="item">
        <img class="avatar" [src]="item.photo" alt="Foto de {{ item.name }}" />
        {{ item.name }}
      </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</form>

@if (agentSelected.length>0) {
<table
  mat-table
  [dataSource]="agentsSelected"
  class="mat-elevation-z8"
  cdkDropList
  cdkDropListData="agentsSelected"
  (cdkDropListDropped)="drop($event)"
>
  <ng-container matColumnDef="photo">
    <th mat-header-cell *matHeaderCellDef>Foto</th>
    <td mat-cell *matCellDef="let agent">
      <img
        class="avatar"
        [src]="agent.photo"
        alt="Foto de {{ agent.name }}"
        style="width: 30px; height: 30px; border-radius: 50%"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let agent">{{ agent.name }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let agent">
      <mat-icon mat-list-icon (click)="removeAgent(agent)"> close </mat-icon>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="['photo', 'name', 'actions']"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: ['photo', 'name', 'actions']"
    cdkDrag
    [cdkDragData]="row"
  ></tr>
</table>
}
